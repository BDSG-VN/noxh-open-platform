name: Sprint 0 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: noxh_owner
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: noxh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U noxh_owner -d noxh" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://noxh_owner:ci-ephemeral-only@localhost:5432/noxh
      ALLOW_SYNTHETIC_FIXTURES: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.3' }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:migrate && pnpm db:seed && pnpm test:db
      - run: pnpm exec openapi-typescript docs/openapi.json -o packages/contracts/src/generated.ts && git diff --exit-code -- packages/contracts/src/generated.ts
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/ai-worker/requirements.txt
      - run: python -m pytest
        working-directory: services/ai-worker
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.3' }
      - run: node scripts/init-dev-env.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 600
      - run: |
          curl --fail http://localhost:4000/health/ready
          curl --fail http://localhost:3000 | python3 -c 'import sys; assert "Khám phá dự án mẫu" in sys.stdin.read()'
          curl --fail http://localhost:3001
          curl --fail http://localhost:3002
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/noxh-private/)" = "403"
      - run: docker compose down
        if: always()
